name: SAGE Public CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - uses: actions/setup-go@v6
        with:
          go-version: "1.24"
          cache: false
      - name: Install deterministic gates
        run: |
          python -m pip install ruff==0.15.21
          npm install --global @biomejs/biome@2.5.3
          npm install --global @colbymchenry/codegraph@1.1.6
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
      - name: Signed private-oracle binding
        run: |
          python tools/verify_public_export.py \
            --repo . \
            --allowed-signers workflow/trusted_signers \
            --expected-repository eason-tien/sage-public \
            --expected-source-repository eason-tien/sage
      - name: CodeGraph invariant
        run: python tools/check_codegraph.py .
      - name: Syntax and unit tests
        env:
          SAGE_GATE_DIAGNOSTICS: "1"
        run: |
          python -m compileall -q tools workflow tests
          python -m unittest discover -s tests -p 'test_*.py'
          node --test tests/sop-run.test.js
      - name: Static quality
        run: |
          ruff check .
          ruff format --check .
          biome check biome.json
          (cd benchmarks/fixture && biome check biome.json src/singleflight.js)
          biome check examples/sprite-audit-game
      - name: Secret scan
        run: gitleaks detect --no-git --redact --source .
      - name: Validate workflows
        run: docker run --rm -v "$PWD:/repo" --workdir /repo rhysd/actionlint:1.7.12

  bash-selftest:
    name: Bash selftest (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: bash scripts/selftest.sh

  powershell-selftest:
    name: PowerShell selftest (Windows)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - shell: pwsh
        run: pwsh -NoProfile -File scripts/selftest.ps1

  shell-lint:
    name: ShellCheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: shellcheck sage scripts/*.sh
